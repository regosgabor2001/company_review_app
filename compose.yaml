version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html:cached
    environment:
      DATABASE_URL: "mysql://app_user:app_password@database:3306/company_review_app_db?serverVersion=8.0"
      MAILER_DSN: "smtp://mailer:1025"
    depends_on:
      - database

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: database
      PMA_USER: app_user
      PMA_PASSWORD: app_password
    depends_on:
      - database